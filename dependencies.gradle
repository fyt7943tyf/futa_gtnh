/*
 * 在这里添加你的模组依赖。可用的配置（GTNH 工具链）：
 *  - api("group:name:version:classifier")          : 你的模组公开 API 里用到的类型，下游可见
 *  - implementation("g:n:v")                        : 仅内部实现使用，运行时可见，下游编译期不可见
 *  - compileOnly("g:n:v")                           : 只在编译期需要（可选联动模组用这个）
 *  - compileOnlyApi("g:n:v")                        : 同 compileOnly，但下游编译期也可见
 *  - runtimeOnlyNonPublishable("g:n:v")             : 只在自己 runClient/runServer 时加载，不作为依赖发布
 *  - devOnlyNonPublishable("g:n:v")                 : compileOnly + runtimeOnlyNonPublishable 的组合
 *  - runtimeOnly("g:n:v")                           : 只在运行时需要
 *
 * 需要反混淆的（未混淆的）jar 用 rfg.deobf(...) 包一层。
 * GTNH 官方 Maven 上的 "-dev" classifier 产物本身已经是反混淆过的，直接用即可。
 *
 * 注意：GregTech (GT5-Unofficial) 体积很大（约 68MB）且带 30 多个传递依赖，
 * 首次配置依赖时会下载较多文件，请耐心等待。
 */

// lwjgl3ify 的目标版本。★ 三处必须一致：compileOnly 的 dev jar、
// runtimeOnlyNonPublishable 的 dev jar、以及 dev 环境里当中「引导层」的
// forgePatches（见文件末尾的说明）。所以只在这里写一次。
def lwjgl3ifyVersion = '3.0.35'

dependencies {
    // ---- GregTech（GT5-Unofficial）----
    // GTNH 的核心模组，提供 GT 的方块/物品/机器/配方 API
    compileOnly("com.github.GTNewHorizons:GT5-Unofficial:5.09.54.175:dev")

    // ---- Not Enough Items（NEI）----
    // GTNH 内置的配方查看器，注册 NEI 配方/隐藏物品时需要
    compileOnly("com.github.GTNewHorizons:NotEnoughItems:2.8.144-GTNH:dev")

    // ---- GTNHLib ----
    // GTNH 公共库（工具类、注册辅助、Mixin 支持）
    compileOnly("com.github.GTNewHorizons:GTNHLib:0.11.51:dev")

    // ---- Baubles-Expanded ----
    // 饰品系统。飞行护符实现它的 IBauble 接口。
    //
    // 注意它的 modid 是 "Baubles|Expanded"（真的带一个竖线），而竖线正是 FML
    // 依赖串里的「或」分隔符 —— 所以 @Mod 的 dependencies 里<b>不能</b>写
    // required-after:Baubles|Expanded，那会被解析成「Baubles 或 Expanded」。
    // 改为在代码里用 Loader.isModLoaded 守卫注册。
    compileOnly("com.github.GTNewHorizons:Baubles-Expanded:2.2.23-GTNH:dev")
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:Baubles-Expanded:2.2.23-GTNH:dev")

    // ---- lwjgl3ify ----
    // 把 1.7.10 升级到 LWJGL3 / 新 Java 的核心模组（GTNH 2.8+ 标配）。
    // 本模组的运行目标是「带 lwjgl3ify 的 GTNH」：
    //  - @Mod 声明 required-after:lwjgl3ify（硬依赖，见 FutaGtnhMod）；
    //  - 搜索框的中文输入法支持来自 lwjgl3ify 对原版 GuiTextField 的 mixin
    //   （IME 探测见 client/ImeCompat.java，代码本身不直接 import 它的类，
    //    所以 compileOnly 只是为了文档化这个约定，运行时靠探测而不是链接）；
    //  - 老版本 lwjgl3ify（GLFW 时代，无 TextFieldHandler）会被探测自动退回
    //    旧的「>255 字符注入」路径，不会坏。
    compileOnly("com.github.GTNewHorizons:lwjgl3ify:${lwjgl3ifyVersion}:dev")
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:lwjgl3ify:${lwjgl3ifyVersion}:dev")

    // ★ dev 环境（runClient17 / runServer17 这类「现代 Java」任务）里，forgePatches
    //   的版本必须和上面一致，否则游戏根本起不来。原因：
    //
    //   GTNHGradle 的 modern-java 模块会**无条件**往 java17PatchDependencies 里塞
    //   com.github.GTNewHorizons:lwjgl3ify:3.0.10:forgePatches（GTNHGradle 2.0.20 里
    //   写死的版本）。这个 jar 在 dev 环境里同时扮演两个角色：
    //     1. 提供 RFB（RetroFuturaBootstrap）本体 —— 它是被 -Djava.system.class.loader
    //        指定的系统类加载器，也就是整个 dev 客户端的引导层；
    //     2. 提供「早期 forge 补丁」（ClassPatchManager 换掉被新 JDK 删掉的 Pack200 等）。
    //   而 lwjgl3ify 3.0.35 的 transformer 用到 RFB 1.1.x 才有的
    //   com.gtnewhorizons.retrofuturabootstrap.api.BytePatternMatcher。
    //   3.0.10 的 forgePatches 里带的是 RFB 1.0.14，于是启动时直接：
    //     NoClassDefFoundError: com/gtnewhorizons/retrofuturabootstrap/api/BytePatternMatcher
    //       at me.eigenraven.lwjgl3ify.rfb.transformers.LwjglRedirectTransformer.<init>
    //   修法：把该配置里 lwjgl3ify 的解析版本统一抬到 3.0.35（见文件末尾的
    //   configurations.configureEach 块）。同模块取高版本之后，classifier 仍是
    //   forgePatches，于是拿到的就是 lwjgl3ify-3.0.35-forgePatches.jar（GTNH Maven
    //   上确实发布了这个带 classifier 的产物，已核对过）。

    // ---- MouseTweaks（可选联动）----
    // 整合包默认装着它。它的「滚轮 tweak」会在滚轮滚过某一格时替玩家合成一次点击
    // （用来在两个物品栏之间搬一个物品）—— 落到共享存储上就变成「滚一格掉一个物品」。
    // 兼容做法是让终端界面实现它的 IMTModGuiContainer 接口，在里面关掉滚轮搬运，
    // 见 client/MouseTweaksCompat.java。没装时那段代码根本不会被加载。
    //
    // 这里 dev 环境也装一份：一是界面要能在和整合包一致的环境里验证，
    // 二是 dev 里能直接看到「滚轮不再掏东西」的效果。
    compileOnly("com.github.GTNewHorizons:MouseTweaks:2.5.3-GTNH:dev")
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:MouseTweaks:2.5.3-GTNH:dev")

    // ---- TinkersConstruct（匠魂，可选联动）----
    // 只在「工作站自动补料」里用到（com.futa_gtnh.tinkers 包）：开着工匠工作站 /
    // 部件加工台 / 合成站 / 冶炼炉的界面时，缺的部件与材料自动从共享存储补。
    // 没装匠魂时那整包代码都不会被加载（见 TinkersAutoFill 的探测守卫）。
    // 运行时它本来就随整合包/GT5 一起进来，所以这里只需要 compileOnly。
    compileOnly("com.github.GTNewHorizons:TinkersConstruct:1.14.111-GTNH:dev")

    // ---- NotEnoughCharacters（NEChar，可选联动）----
    // 拼音/模糊音搜索复用它的 PinIn 上下文（net.moecraft.nechar.NecharUtils），
    // 装了就自动启用、没装退回自研 pinyin.txt（见 client/NecharBridge.java）。
    // 所有 NEChar 类型引用隔离在 NecharBridge.Hook 一个类里，缺席时不会加载。
    compileOnly("com.github.GTNewHorizons:NotEnoughCharacters:1.7.10-1.5.5-GTNH:dev")

    // ---- LootGames（可选联动：小游戏助手 + 行为 Mixin）----
    //
    // 编译与 dev 运行都用「本地原样构建」的 dev jar（../LootGames-master，
    // 不改它一行代码，只是跑一次 gradlew build 出 jar），原因：
    //  1. 本 mod 对 lootgames 的 mixin 目标类必须和运行时那份 lootgames 完全一致，
    //     用本地源码构建出来的 jar 才能保证这一点（Maven 上的发布版未必和手里
    //     的源码同步，mixin 目标差一个签名就会应用失败）；
    //  2. 整合包里也应放同一份构建产物（官方 jar 的行为完全一样，只是没有本地
    //     构建这一层保证）。
    //
    // 没构建过 LootGames-master 时这里是空集合：mixin 与助手相关代码会编译报错，
    // 提示先去那边跑一次 gradlew build。
    def lootGamesDevJars = fileTree(dir: '../LootGames-master/build/libs', include: ['*-dev.jar'])
    compileOnly(lootGamesDevJars)
    runtimeOnlyNonPublishable(lootGamesDevJars)

    // ---- runClient / runServer 里真正要加载的模组 ----
    //
    // ★ 这几行是必需的，不是可选的。
    //   共享背包用 @Mod(dependencies = "required-after:gregtech") 声明了 GT 是硬依赖
    //   （存储键的规范化、流体显示物品、流体灌装都直接用 GTUtility）。
    //   而上面那些 compileOnly 只在编译期可见、不会进开发环境的 mods 目录，
    //   所以如果这里不补运行时依赖，runClient 会直接以
    //   「Missing required mod gregtech」拒绝加载本模组，什么都测不了。
    //
    //   加了之后第一次 runClient 会慢不少（GT 本身体积很大），属正常现象。
    //   如果只是临时想跑起来看看界面、不想等 GT 加载，把这几行注释掉，
    //   同时把 FutaGtnhMod 的 dependencies 里的 required-after 一并去掉。
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:GT5-Unofficial:5.09.54.175:dev")
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:NotEnoughItems:2.8.144-GTNH:dev")
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:GTNHLib:0.11.51:dev")

    // ---- 本地依赖示例 ----
    // 把 jar 放到 libs/ 目录后这样引用：
    // compileOnly(files("libs/your-mod.jar"))
}

// ---------------------------------------------------------------------------
//  dev 环境专用：把 java17PatchDependencies 里的 lwjgl3ify 抬到 3.0.35
//
//  GTNHGradle 2.0.20 的 ModernJavaModule 写死了
//      java17PatchDependencies "com.github.GTNewHorizons:lwjgl3ify:3.0.10:forgePatches"
//  这个配置只被 runClient17 / runServer17 / runClient21 / … 这类「现代 Java」
//  任务用到（runClient 走 Java 8 + LWJGL2，不需要它，所以 runClient 里看不到）。
//
//  它必须和 java17Dependencies 里的 lwjgl3ify 同版本，否则就会像 2026-09-24 那样：
//      Exception in thread "RFB-Main" java.lang.RuntimeException:
//        java.lang.NoClassDefFoundError:
//          com/gtnewhorizons/retrofuturabootstrap/api/BytePatternMatcher
//          at me.eigenraven.lwjgl3ify.rfb.transformers.LwjglRedirectTransformer.<init>
//  因为 3.0.10 的 forgePatches 里打包的是 RFB 1.0.14，而 3.0.35 的 transformer
//  需要 RFB 1.1.x 的 API。
//
//  为什么不直接在 dependencies { } 里写 java17PatchDependencies(...)？
//  因为那个配置是 GTNHGradle 建的「只可解析」配置，Gradle 9 不允许再用
//  dependencies { 配置名("坐标") } 这种隐式写法往它里面加依赖（会报
//  Could not find method java17PatchDependencies()）。改解析规则更稳，也不依赖
//  配置的创建时机（configureEach 对后创建的配置同样生效）。
// ---------------------------------------------------------------------------
configurations.configureEach {
    if (name == 'java17PatchDependencies' || name == 'java17PatchDependenciesCfg') {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.github.GTNewHorizons'
                && details.requested.name == 'lwjgl3ify') {
                details.useVersion(lwjgl3ifyVersion)
            }
        }
    }
}
