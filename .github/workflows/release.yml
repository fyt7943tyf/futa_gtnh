# 正式发版统一从 Actions 手动触发；普通 push 仅运行 ci.yml。
# 默认自动升补丁号。构建通过后才写回 version.txt，并原子推送 main + tag。
name: 发版
run-name: 发版 ${{ inputs.bump }}${{ inputs.dry_run && '（仅验证）' || '' }} · @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: '版本操作：patch 补丁 / minor 次版本 / major 主版本 / retry 重试未发布版本'
        type: choice
        required: true
        default: patch
        options: [patch, minor, major, retry]
      dry_run:
        description: '仅验证：构建检查，不写回版本、不创建 tag、不发布'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置临时发版状态路径
        run: echo "RELEASE_STATE=$RUNNER_TEMP/futa-release-plan.json" >> "$GITHUB_ENV"

      - name: 运行发版规则测试
        run: python3 -m unittest discover -s tools/release -p 'test_*.py' -v

      - name: 计算并准备新版本
        id: plan
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git fetch origin main --tags
          python3 tools/release/release.py prepare --state "$RELEASE_STATE" --bump "$BUMP"

      - name: 设置 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: 构建与检查
        run: ./gradlew build spotlessCheck --build-cache --stacktrace

      - name: 核对 JAR 版本并整理发布文件
        run: python3 tools/release/release.py verify --state "$RELEASE_STATE"

      - name: 提交新版本并原子推送 main 和 tag
        if: inputs.dry_run == false
        run: python3 tools/release/release.py record --state "$RELEASE_STATE"

      - name: 创建或恢复未发布草稿
        if: inputs.dry_run == false
        run: python3 tools/release/release.py draft --state "$RELEASE_STATE"

      - name: 上传附件到草稿
        if: inputs.dry_run == false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.plan.outputs.tag }}
          draft: true
          files: release-assets/*
          fail_on_unmatched_files: true

      - name: 核对附件并正式发布
        if: inputs.dry_run == false
        run: python3 tools/release/release.py publish --state "$RELEASE_STATE"

      - name: 保存仅验证的构建产物
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-${{ steps.plan.outputs.version }}-${{ github.run_number }}
          path: release-assets/*
          retention-days: 7
